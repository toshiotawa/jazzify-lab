<!doctype html>
<html>
<body>
<script type="module">
import { loadModel } from './engine/models.js';
import { resolveKernel } from './engine/kernel-load.js';
import { KEY_COUNT, LOWEST_MIDI } from './engine/tracker.js';

const ON = 0.6;
const OFF = 0.36;
const STRONG = 0.9;
const SLOW = 2;
const RELEASE = 5;
const NEIGHBOR = 2;
const MIN = 21;
const MAX = 108;
const params = new URLSearchParams(location.search);
const wsPort = Number(params.get('wsPort') ?? '0');
const token = params.get('token') ?? '';
const post = (payload) => {
  window.webkit?.messageHandlers?.pitch?.postMessage(payload);
};
const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const noteName = (midi) => `${names[((midi % 12) + 12) % 12]}${Math.floor(midi / 12) - 1}`;
const emitted = new Uint8Array(128);
const confirm = new Int32Array(128);
const release = new Int32Array(128);
const sinceOn = new Int32Array(128);
sinceOn.fill(-1);

const stepFromProbs = (probs) => {
  if (!probs || probs.length < KEY_COUNT) return;
  for (let midi = MIN; midi <= MAX; midi += 1) {
    const keyIndex = midi - LOWEST_MIDI;
    const level = keyIndex >= 0 && keyIndex < probs.length ? probs[keyIndex] : 0;
    if (emitted[midi]) {
      if (level >= OFF) {
        release[midi] = 0;
        continue;
      }
      release[midi] += 1;
      if (release[midi] >= RELEASE) {
        emitted[midi] = 0;
        confirm[midi] = 0;
        release[midi] = 0;
        sinceOn[midi] = -1;
        post({ kind: 'off', midi });
      }
      continue;
    }
    if (level < ON) {
      confirm[midi] = 0;
      continue;
    }
    let blocked = false;
    if (sinceOn[midi] < 0 || sinceOn[midi] < NEIGHBOR) {
      for (const neighbor of [midi - 1, midi + 1]) {
        const neighborKey = neighbor - LOWEST_MIDI;
        const neighborLevel = neighborKey >= 0 && neighborKey < probs.length ? probs[neighborKey] : 0;
        if (neighborLevel > level && neighborLevel >= STRONG) blocked = true;
      }
    }
    if (blocked) {
      confirm[midi] = 0;
      continue;
    }
    confirm[midi] += 1;
    const need = level >= STRONG ? 1 : SLOW;
    if (confirm[midi] < need) continue;
    emitted[midi] = 1;
    confirm[midi] = 0;
    release[midi] = 0;
    sinceOn[midi] = 0;
    post({ kind: 'on', midi, name: noteName(midi) });
  }
  for (let midi = MIN; midi <= MAX; midi += 1) {
    if (sinceOn[midi] >= 0) sinceOn[midi] += 1;
  }
};

try {
  if (!wsPort || !token) {
    throw new Error('PCM ソケットのパラメータがありません');
  }
  const [loaded, kernel] = await Promise.all([
    loadModel('piano', undefined, './'),
    resolveKernel('auto', 'bytes', undefined, './'),
  ]);
  const detector = kernel.impl.createDetector(
    kernel.impl.parseWeights(loaded.manifest, loaded.weights),
    { inputRate: 48000, wasmModule: kernel.wasm },
  );

  const ws = new WebSocket(`ws://127.0.0.1:${wsPort}`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    ws.send(token);
  };

  ws.onerror = () => {
    post({ kind: 'error', message: 'PCM ソケットに接続できません' });
  };

  ws.onmessage = (event) => {
    if (typeof event.data === 'string') {
      if (event.data === 'ok') {
        post({ kind: 'ready' });
      }
      return;
    }
    const samples = new Float32Array(event.data);
    let frames;
    try {
      frames = detector.push(samples);
    } catch (error) {
      post({ kind: 'error', message: String(error?.message || error) });
      ws.close();
      return;
    }
    for (const frame of frames) {
      stepFromProbs(frame.probs);
    }
  };
} catch (error) {
  post({ kind: 'error', message: String(error?.message || error) });
}
</script>
</body>
</html>
