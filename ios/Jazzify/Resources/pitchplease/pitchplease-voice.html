<!doctype html>
<html>
<body>
<script type="module">
const ON = 0.6;
const OFF = 0.36;
const STRONG = 0.9;
const SLOW = 2;
const RELEASE = 5;
const NEIGHBOR = 2;
const MIN = 21;
const MAX = 108;
const params = new URLSearchParams(location.search);
const channel = params.get('channel') === '2' ? 2 : 1;
const post = (payload) => {
  window.webkit?.messageHandlers?.pitch?.postMessage(payload);
};
const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const noteName = (midi) => `${names[((midi % 12) + 12) % 12]}${Math.floor(midi / 12) - 1}`;
const emitted = new Uint8Array(128);
const confirm = new Int32Array(128);
const release = new Int32Array(128);
const sinceOn = new Int32Array(128);
sinceOn.fill(-1);

const step = (levels) => {
  for (let midi = MIN; midi <= MAX; midi += 1) {
    const level = levels[midi] ?? 0;
    if (emitted[midi]) {
      if (level >= OFF) {
        release[midi] = 0;
        continue;
      }
      release[midi] += 1;
      if (release[midi] >= RELEASE) {
        emitted[midi] = 0;
        confirm[midi] = 0;
        release[midi] = 0;
        sinceOn[midi] = -1;
        post({ kind: 'off', midi });
      }
      continue;
    }
    if (level < ON) {
      confirm[midi] = 0;
      continue;
    }
    let blocked = false;
    if (sinceOn[midi] < 0 || sinceOn[midi] < NEIGHBOR) {
      for (const neighbor of [midi - 1, midi + 1]) {
        const neighborLevel = levels[neighbor] ?? 0;
        if (neighborLevel > level && neighborLevel >= STRONG) blocked = true;
      }
    }
    if (blocked) {
      confirm[midi] = 0;
      continue;
    }
    confirm[midi] += 1;
    const need = level >= STRONG ? 1 : SLOW;
    if (confirm[midi] < need) continue;
    emitted[midi] = 1;
    confirm[midi] = 0;
    release[midi] = 0;
    sinceOn[midi] = 0;
    post({ kind: 'on', midi, name: noteName(midi) });
  }
  for (let midi = MIN; midi <= MAX; midi += 1) {
    if (sinceOn[midi] >= 0) sinceOn[midi] += 1;
  }
};

try {
  const { create } = await import('./pitchplease.js');
  const detector = create({
    model: 'piano',
    assetBaseUrl: './',
    onNotes: (_notes, frame) => {
      const levels = new Array(128).fill(0);
      const probs = frame?.probs;
      if (probs) {
        const count = Math.min(probs.length, MAX - MIN + 1);
        for (let i = 0; i < count; i += 1) levels[MIN + i] = probs[i];
      }
      step(levels);
    },
    onError: (error) => post({ kind: 'error', message: String(error?.message || error) }),
  });
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: {
      channelCount: channel === 2 ? { exact: 2 } : { ideal: 2 },
      echoCancellation: true,
      noiseSuppression: false,
      autoGainControl: false,
    },
    video: false,
  });
  const count = stream.getAudioTracks()[0]?.getSettings?.().channelCount ?? null;
  let input = stream;
  if (channel === 2) {
    if (count !== null && count < 2) {
      post({ kind: 'error', message: '入力2を選択できません。ブラウザから2チャンネルの音声を取得できていません。' });
      throw new Error('voice-input-channel-unavailable');
    }
    const context = new AudioContext({ sampleRate: 48000 });
    if (context.state === 'suspended') await context.resume();
    const source = context.createMediaStreamSource(stream);
    const splitter = context.createChannelSplitter(Math.max(source.channelCount, 2));
    const destination = context.createMediaStreamDestination();
    source.connect(splitter);
    splitter.connect(destination, 1, 0);
    input = destination.stream;
  }
  const started = await detector.start(input);
  post({ kind: started ? 'ready' : 'error', message: started ? '' : 'PitchPlease を開始できませんでした' });
} catch (error) {
  post({ kind: 'error', message: String(error?.message || error) });
}
</script>
</body>
</html>
