name: Jazzify
options:
  bundleIdPrefix: jp.jazzify
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.4.9"
    CURRENT_PROJECT_VERSION: "2"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: "1.20.0"

targets:
  Jazzify:
    type: application
    platform: iOS
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    sources:
      - path: Jazzify
        excludes:
          # Tutorial/ に同一ファイルがあり bundle 複製で build が失敗するため
          - EarTraining/Tutorial/ear-training-developer-full-v1.script.json
      # QuestStageCards は ~120MB のため Asset Catalog ではなく Web と共有の PNG を folder reference で bundle 直置き
      # (Bundle.main.url(..., subdirectory:) で読むため階層を保持する folder 指定が必須)
      - path: ../public/stage_cards_collection
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.jazzify.app
        INFOPLIST_FILE: Jazzify/Info.plist
        CODE_SIGN_ENTITLEMENTS: Jazzify/Jazzify.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Supabase
        product: Supabase
      - package: onnxruntime
        product: onnxruntime
    entitlements:
      path: Jazzify/Jazzify.entitlements

  JazzifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JazzifyTests
    dependencies:
      - target: Jazzify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.jazzify.app.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ""

schemes:
  Jazzify:
    build:
      targets:
        Jazzify: all
        JazzifyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JazzifyTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
