<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Slide</title>
  <link rel="stylesheet" href="{{STAFF_CSS_URI}}" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: #ebe6dc;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .layout { width: 100%; height: 100%; display: none; }
    body[data-orientation="horizontal"] .layout-h { display: flex; flex-direction: column; }
    body[data-orientation="vertical"] .layout-v-full,
    body[data-orientation="vertical_lower"] .layout-v-lower { display: flex; flex-direction: column; }

    /* horizontal 1920x1080 — score is main */
    .layout-h {
      padding: 40px 56px 36px;
      gap: 12px;
    }
    .layout-h .header {
      display: flex;
      align-items: center;
      gap: 32px;
      flex: 0 0 auto;
    }
    .layout-h .jacket img {
      width: 280px;
      height: 280px;
      object-fit: cover;
      border-radius: 2px;
      border: 1px solid rgba(255,255,255,.1);
      background: #141414;
    }
    .layout-h .meta h1 { font-size: 52px; font-weight: 500; line-height: 1.15; }
    .layout-h .meta h2 { font-size: 30px; font-weight: 400; color: #a8a39a; margin-top: 8px; line-height: 1.25; }
    .layout-h .meta p.record { font-size: 20px; color: #6f6a62; margin-top: 10px; max-width: 36em; line-height: 1.35; }
    .layout-h .score-main {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .layout-h .score-wrap {
      width: 1680px;
      height: 560px;
      max-height: 100%;
    }

    /* vertical safe zone */
    .layout-v-full {
      align-items: center;
      padding: 250px 140px 420px 64px;
      gap: 16px;
    }
    .layout-v-full .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      flex: 0 0 auto;
    }
    .layout-v-full .jacket img {
      width: 340px;
      height: 340px;
      object-fit: cover;
      border-radius: 2px;
      border: 1px solid rgba(255,255,255,.1);
    }
    .layout-v-full .meta { text-align: center; max-width: 820px; }
    .layout-v-full .meta h1 { font-size: 46px; font-weight: 500; line-height: 1.15; }
    .layout-v-full .meta h2 { font-size: 28px; color: #a8a39a; margin-top: 8px; line-height: 1.25; }
    .layout-v-full .meta p.record { font-size: 18px; color: #6f6a62; margin-top: 8px; line-height: 1.35; }
    .layout-v-full .score-main {
      flex: 1 1 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .layout-v-full .score-wrap { width: 876px; height: 420px; max-width: 100%; }

    /* vertical lower half */
    .layout-v-lower {
      justify-content: flex-end;
      padding: 0 140px 420px 64px;
    }
    .layout-v-lower .content-lower {
      width: 100%;
      max-height: 960px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .layout-v-lower .header {
      display: flex;
      align-items: center;
      gap: 20px;
      flex: 0 0 auto;
    }
    .layout-v-lower .jacket img {
      width: 168px;
      height: 168px;
      object-fit: cover;
      border-radius: 2px;
      border: 1px solid rgba(255,255,255,.1);
    }
    .layout-v-lower .meta h1 { font-size: 34px; font-weight: 500; line-height: 1.15; }
    .layout-v-lower .meta h2 { font-size: 22px; color: #a8a39a; margin-top: 4px; line-height: 1.25; }
    .layout-v-lower .meta p.record { font-size: 16px; color: #6f6a62; margin-top: 6px; line-height: 1.3; }
    .layout-v-lower .score-main {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .layout-v-lower .score-wrap { width: 876px; height: 360px; max-width: 100%; }

    .score-wrap {
      position: relative;
      overflow: visible;
    }
    .score-wrap > div { width: 100%; height: 100%; }
    .somisira-staff svg { display: block; width: 100%; height: auto; max-height: 100%; }
    .somisira-staff .drop-shadow-\[0_2px_10px_rgba\(0\,0\,0\,0\.8\)\] {
      filter: none;
    }
  </style>
</head>
<body data-orientation="{{ORIENTATION}}">
  <script type="application/json" id="score-data">{{SCORE_JSON}}</script>

  <div class="layout layout-h">
    <div class="header">
      <div class="jacket"><img src="{{COVER_URI}}" alt="" /></div>
      <div class="meta">
        <h1>{{PERFORMER}}</h1>
        <h2>{{TITLE}}</h2>
        <p class="record">{{RECORD_TITLE}}</p>
      </div>
    </div>
    <div class="score-main">
      <div class="score-wrap"><div id="score-h"></div></div>
    </div>
  </div>

  <div class="layout layout-v-full">
    <div class="header">
      <div class="jacket"><img src="{{COVER_URI}}" alt="" /></div>
      <div class="meta">
        <h1>{{PERFORMER}}</h1>
        <h2>{{TITLE}}</h2>
        <p class="record">{{RECORD_TITLE}}</p>
      </div>
    </div>
    <div class="score-main">
      <div class="score-wrap"><div id="score-v"></div></div>
    </div>
  </div>

  <div class="layout layout-v-lower">
    <div class="content-lower">
      <div class="header">
        <div class="jacket"><img src="{{COVER_URI}}" alt="" /></div>
        <div class="meta">
          <h1>{{PERFORMER}}</h1>
          <h2>{{TITLE}}</h2>
          <p class="record">{{RECORD_TITLE}}</p>
        </div>
      </div>
      <div class="score-main">
        <div class="score-wrap"><div id="score-vl"></div></div>
      </div>
    </div>
  </div>

  <script src="{{STAFF_BUNDLE_URI}}"></script>
</body>
</html>
